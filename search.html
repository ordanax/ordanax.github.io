---
layout: default
title: Поиск
description: Поиск по статьям и руководствам блога об Arch Linux.
---

<div class="blog-post">
  <h1 class="blog-post-title">Поиск</h1>
  <hr>
  <p>Введите запрос для поиска по статьям:</p>
  <input type="text" id="search-input" placeholder="Поиск…" style="width:100%;max-width:400px;padding:10px 14px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:1rem;outline:none;" oninput="searchPosts(this.value)">
  <div id="search-results" style="margin-top:20px;"></div>
</div>

<script>
(function() {
  var posts = [];
  var input = document.getElementById('search-input');
  var results = document.getElementById('search-results');

  function loadPosts() {
    var pages = [
      {% for post in site.posts %}
      {
        title: {{ post.title | jsonify }},
        url: {{ post.url | jsonify }},
        excerpt: {{ post.excerpt | strip_html | truncatewords: 50 | jsonify }},
        date: '{{ post.date | date: "%d.%m.%Y" }}',
        tags: {{ post.tags | jsonify }}
      },
      {% endfor %}
    ];
    posts = pages;
    var q = new URLSearchParams(window.location.search).get('q');
    if (q) { input.value = q; searchPosts(q); }
  }

  function searchPosts(query) {
    var q = query.trim().toLowerCase();
    if (!q) { results.innerHTML = ''; return; }
    var filtered = posts.filter(function(p) {
      return p.title.toLowerCase().includes(q) ||
             (p.excerpt && p.excerpt.toLowerCase().includes(q)) ||
             (p.tags && p.tags.some(function(t) { return t.toLowerCase().includes(q); }));
    });
    if (filtered.length === 0) {
      results.innerHTML = '<p style="color:var(--text-muted)">Ничего не найдено</p>';
      return;
    }
    var html = '';
    filtered.forEach(function(p) {
      html += '<article class="post-card" style="margin-bottom:12px;">' +
        '<h2 style="margin:0 0 6px;font-size:1.1rem;"><a href="' + p.url + '">' + escapeHtml(p.title) + '</a></h2>' +
        '<div class="post-card-meta">' + p.date + '</div>' +
        '<div class="post-card-excerpt">' + escapeHtml(p.excerpt) + '</div>' +
        '<a href="' + p.url + '" class="read-more">Читать далее &raquo;</a>' +
        '</article>';
    });
    results.innerHTML = html;
    history.replaceState(null, '', '?q=' + encodeURIComponent(q));
  }

  function escapeHtml(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  if (document.readyState === 'complete') loadPosts();
  else window.addEventListener('load', loadPosts);
})();
</script>
