<!DOCTYPE html>
<html lang="ru">
{% include head.html %}

<body>
	<div class="container">
		{% include header.html %}
	</div>
	{% include top-nav.html %}
	<div class="container">
		<div class="row">
			<div class="col-md-9 blog-main">{{ content }}</div>
			<div class="col-md-3 blog-sidebar">{% include sidebar.html %}</div>
		</div>
	</div>
	<div class="blog-footer">
		{% include footer.html %}
	</div>
	<button class="back-to-top" id="backToTop" aria-label="Наверх">&#8593;</button>
{% include code.html %}
	<script>
	(function() {
		var btn = document.getElementById('backToTop');
		if (!btn) return;
		window.addEventListener('scroll', function() {
			btn.classList.toggle('visible', window.scrollY > 400);
		});
		btn.addEventListener('click', function() {
			window.scrollTo({ top: 0, behavior: 'smooth' });
		});
	})();
	</script>
</body>

</html>
