<div class="cta-chat{% if include.compact %} cta-chat-compact{% endif %}">

	<div class="cta-chat-head">
		<h4>Не получилось? Поможем настроить</h4>
		<p>Задай вопрос в чате — отвечаем быстро, по делу и без воды.</p>

		<a class="btn btn-chat btn-chat-max" href="https://max.ru/join/X9LNZmlPqmGHweB7EtIRwbdNwtwmhY4JnhX0jDKyaxs" target="_blank" rel="nofollow noopener" data-goal="max" title="Открыть чат в Max"><i class="fas fa-comments" aria-hidden="true"></i> Max · Присоединиться</a>
