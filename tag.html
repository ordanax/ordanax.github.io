---
layout: default
title: Тег
---

<div class="blog-post">
    <h1 class="blog-post-title">Статьи с тегом: {{ page.tag }}</h1>
    <hr>
    {% for post in site.tags[page.tag] %}
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        <p>
            <span class="blog-post-meta">{{ post.date|date:"%d.%m.%Y" }}</span>
        </p>
        <div class="entry">
            {{ post.excerpt }}
        </div>
        <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">Читать далее &raquo;</a>
        <br>
        <hr>
    {% endfor %}
    {% if site.tags[page.tag] == empty %}
        <p>Статей с этим тегом не найдено.</p>
    {% endif %}
</div>
